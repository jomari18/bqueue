name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build the web app
        run: npm run build -w @bq/web

  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bq
          POSTGRES_PASSWORD: bq
          POSTGRES_DB: bq_test
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U bq -d bq_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://bq:bq@127.0.0.1:55434/bq_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:api

  image:
    name: API Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bq
          POSTGRES_PASSWORD: bq
          POSTGRES_DB: bq_test
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U bq -d bq_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f apps/api/Dockerfile -t bqueue-api:ci .
      # The container migrates an empty database and starts, as it will on Render. CI-only values.
      - name: Smoke test
        run: |
          docker run -d --name bq-api --network host \
            -e DATABASE_URL=postgres://bq:bq@127.0.0.1:55434/bq_test \
            -e JWT_SECRET=ci-only-jwt-secret-0123456789abcdefghij \
            -e SOCKET_TICKET_SECRET=ci-only-socket-ticket-secret-01234567 \
            -e PROXY_SIGNING_SECRET=ci-only-proxy-signing-secret-0123456789 \
            -e CLEANUP_SECRET=ci-only-cleanup-secret-0123456789abcdef \
            -e IP_HASH_SALT=ci-only-ip-hash-salt-0123456789abcdefgh \
            -e SITE_ORIGIN=http://localhost:3100 \
            -e SIMULATOR_ENABLED=false \
            bqueue-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then
              docker logs bq-api
              exit 0
            fi
            sleep 1
          done
          docker logs bq-api
          exit 1
      - name: Save image for the E2E job
        run: docker save bqueue-api:ci | gzip -1 > bqueue-api.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: bqueue-api-image
          path: bqueue-api.tar.gz
          retention-days: 1
          compression-level: 0
